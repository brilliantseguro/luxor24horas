<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxor Bonus</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    color: white;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
}

/* 🔥 FONDO CON TU IMAGEN */
.bg {
    position: fixed;
    inset: 0;
    background: url('fondooweb.png') center/cover no-repeat;
    filter: blur(10px) brightness(0.5);
    transform: scale(1.1);
    z-index: -2;
}

/* overlay oscuro + dorado */
.bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        rgba(0,0,0,0.75),
        rgba(0,0,0,0.85)
    );
    z-index: -1;
}

/* CONTENEDOR */
.container {
    text-align: center;
    max-width: 400px;
    width: 92%;
    padding-top: 28px;
}

/* LOGO */
.logo {
    width: 210px;
    margin-bottom: 12px;
}

/* TEXTOS */
h1 {
    font-size: 28px;
    color: #ffd700;
}

h2 {
    font-size: 21px;
    margin: 8px 0 5px;
}

.extra {
    font-size: 18px;
    color: #a855f7;
    margin-bottom: 20px;
}

/* BOTÓN */
.btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 28px;
    border-radius: 22px;
    background: rgba(168, 85, 247, 0.3);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(216, 180, 254, 0.8);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    text-decoration: none;
    animation: pulse 1s infinite;
}

.btn::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 25px;
    border: 2px solid rgba(168, 85, 247, 0.6);
    animation: ring 1s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); background: rgba(168,85,247,0.3);}
    50% { transform: scale(1.12); background: rgba(126,34,206,0.9);}
    100% { transform: scale(1);}
}

@keyframes ring {
    0% { transform: scale(0.9); opacity: 1;}
    100% { transform: scale(1.3); opacity: 0;}
}

.whatsapp-icon {
    width: 24px;
}

/* CONTADOR */
.timer-text {
    margin-top: 20px;
    font-size: 16px;
    color: #bfbfbf;
    font-weight: bold;
}

/* BARRA */
.timer-bar {
    width: 100%;
    height: 10px;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    overflow: hidden;
    margin-top: 8px;
}

.timer-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #a855f7, #9333ea);
}

/* LOGO ABAJO */
.footer-logo {
    margin-top: 60px;
    width: 200px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

    <img src="logo.png" class="logo">

    <h1>¡Tiempo limitado!</h1>
    <h2>canjea tu bono del 30% AHORA!</h2>
    <div class="extra">y comenzá a jugar</div>

    <a id="btnWhats" class="btn" target="_blank">
        <svg class="whatsapp-icon" viewBox="0 0 32 32">
            <path fill="#25D366" d="M16.04 3C9.45 3 4.08 8.33 4.08 14.88c0 2.1.55 4.15 1.6 5.95L4 29l8.39-1.64a12.02 12.02 0 0 0 5.65 1.43h.01c6.59 0 11.96-5.33 11.96-11.89C30 8.33 22.63 3 16.04 3z"/>
            <path fill="#FFF" d="M22.95 19.42c-.38-.19-2.23-1.1-2.58-1.23-.35-.13-.6-.19-.86.19-.25.38-.99 1.23-1.21 1.48-.22.25-.45.29-.83.1-.38-.19-1.6-.59-3.05-1.88-1.13-1-1.89-2.24-2.11-2.62-.22-.38-.02-.58.17-.77.17-.17.38-.45.57-.67.19-.22.25-.38.38-.64.13-.25.06-.48-.03-.67-.1-.19-.86-2.07-1.18-2.84-.31-.74-.63-.64-.86-.65h-.73c-.25 0-.67.1-1.02.48-.35.38-1.34 1.31-1.34 3.19s1.37 3.7 1.56 3.95c.19.25 2.69 4.1 6.51 5.75.91.39 1.62.62 2.17.8.91.29 1.74.25 2.39.15.73-.11 2.23-.91 2.55-1.79.32-.88.32-1.63.22-1.79-.09-.16-.35-.25-.73-.44z"/>
        </svg>
        CANJEAR BONO
    </a>

    <div class="timer-text" id="timerText">
        Tiempo para canjear: 30 s
    </div>

    <div class="timer-bar">
        <div class="timer-fill" id="timerFill"></div>
    </div>

    <img src="ganamos.png" class="footer-logo">

</div>

<script>
let tiempo = 30;
let barra = document.getElementById("timerFill");
let texto = document.getElementById("timerText");

let intervalo = setInterval(() => {
    tiempo--;
    texto.innerHTML = "Tiempo para canjear: " + tiempo + " s";
    barra.style.width = (tiempo / 30) * 100 + "%";

    if (tiempo <= 0) {
        clearInterval(intervalo);
        texto.innerHTML = "⛔ Bono expirado";
    }
}, 1000);

function generarCodigo() {
    return Math.floor(1000 + Math.random() * 9000);
}

document.getElementById("btnWhats").addEventListener("click", function() {
    let codigo = generarCodigo();

    let mensaje = encodeURIComponent(
        "Hola vengo a reclamar mi bon0. Cod: " + codigo
    );

    this.href = "https://wa.me/543417418892?text=" + mensaje;
});
</script>

</body>
</html>
