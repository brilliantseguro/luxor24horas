<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxor Bonus</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    color: white;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    overflow: hidden;
    background: #050005;
}

/* FONDO PIRÁMIDE VISIBLE + PRO */
.bg {
    position: fixed;
    inset: 0;
    background: url('fondooweb.png') center/cover no-repeat;
    filter: blur(4px) brightness(0.9) contrast(1.15) saturate(1.1);
    transform: scale(1.05);
    z-index: -3;
}

.bg-dark {
    position: fixed;
    inset: 0;
    background:
        radial-gradient(circle at center, rgba(255, 190, 60, 0.12), transparent 38%),
        linear-gradient(to bottom, rgba(0,0,0,0.18), rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.85));
    z-index: -2;
}

.bg-vignette {
    position: fixed;
    inset: 0;
    box-shadow: inset 0 0 120px rgba(0,0,0,0.95);
    z-index: -1;
}

/* CONTENIDO */
.container {
    text-align: center;
    max-width: 410px;
    width: 92%;
    padding-top: 24px;
    position: relative;
}

/* LOGO PRINCIPAL */
.logo {
    width: 195px;
    max-width: 78%;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 18px rgba(255, 200, 60, 0.45));
}

/* TEXTOS */
h1 {
    font-size: 30px;
    color: #ffd700;
    text-shadow: 0 0 14px rgba(255, 215, 0, 0.75);
    margin-bottom: 6px;
}

h2 {
    font-size: 22px;
    line-height: 1.2;
    color: #ffffff;
    text-shadow: 0 0 12px rgba(0,0,0,0.9);
    margin-bottom: 6px;
}

.extra {
    font-size: 19px;
    color: #c084fc;
    font-weight: 700;
    margin-bottom: 22px;
    text-shadow: 0 0 12px rgba(168,85,247,0.95);
}

/* BOTÓN WHATSAPP */
.btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    padding: 17px 30px;
    border-radius: 24px;
    background: rgba(168, 85, 247, 0.32);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(216, 180, 254, 0.9);
    color: white;
    font-size: 18px;
    font-weight: 900;
    letter-spacing: 0.6px;
    cursor: pointer;
    text-decoration: none;
    box-shadow: 0 0 20px rgba(168, 85, 247, 0.75);
    animation: pulseColor 0.95s infinite ease-in-out;
}

.btn::before {
    content: "";
    position: absolute;
    inset: -7px;
    border-radius: 30px;
    border: 2px solid rgba(192,132,252,0.8);
    animation: pulseRing 0.95s infinite ease-out;
}

.btn::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 24px;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.22), transparent);
    transform: translateX(-120%);
    animation: shine 2.1s infinite;
}

.whatsapp-icon {
    width: 26px;
    height: 26px;
    z-index: 2;
}

.btn span {
    z-index: 2;
}

@keyframes pulseColor {
    0% {
        transform: scale(1);
        background: rgba(168, 85, 247, 0.28);
        box-shadow: 0 0 14px rgba(168,85,247,0.55);
    }
    50% {
        transform: scale(1.13);
        background: rgba(126, 34, 206, 0.92);
        box-shadow: 0 0 35px rgba(192,132,252,1), 0 0 65px rgba(147,51,234,0.9);
    }
    100% {
        transform: scale(1);
        background: rgba(168, 85, 247, 0.28);
        box-shadow: 0 0 14px rgba(168,85,247,0.55);
    }
}

@keyframes pulseRing {
    0% {
        transform: scale(0.92);
        opacity: 1;
    }
    100% {
        transform: scale(1.38);
        opacity: 0;
    }
}

@keyframes shine {
    0% { transform: translateX(-120%); }
    45% { transform: translateX(130%); }
    100% { transform: translateX(130%); }
}

/* CONTADOR */
.timer-text {
    margin-top: 24px;
    font-size: 16px;
    color: #c9c9c9;
    font-weight: 800;
    text-shadow: 0 0 8px rgba(0,0,0,0.9);
}

/* BARRA */
.timer-bar {
    width: 100%;
    height: 11px;
    background: rgba(255,255,255,0.22);
    border-radius: 30px;
    overflow: hidden;
    margin-top: 8px;
    border: 1px solid rgba(255,255,255,0.18);
    box-shadow: 0 0 14px rgba(168,85,247,0.45);
}

.timer-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #d8b4fe, #a855f7, #6d28d9);
    box-shadow: 0 0 18px rgba(192,132,252,0.95);
    transition: width 0.4s linear;
}

/* LOGO GANAMOS */
.footer-logo {
    margin-top: 72px;
    width: 205px;
    max-width: 78%;
    opacity: 0.96;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.25));
}

/* MOBILE */
@media (max-width: 480px) {
    .container {
        padding-top: 18px;
    }

    .logo {
        width: 175px;
    }

    h1 {
        font-size: 27px;
    }

    h2 {
        font-size: 20px;
    }

    .extra {
        font-size: 18px;
    }

    .btn {
        font-size: 16px;
        padding: 16px 24px;
    }

    .footer-logo {
        margin-top: 66px;
        width: 195px;
    }
}
</style>
</head>

<body>

<div class="bg"></div>
<div class="bg-dark"></div>
<div class="bg-vignette"></div>

<div class="container">

    <img src="logo.png" class="logo" alt="Luxor Red">

    <h1>¡Tiempo limitado!</h1>
    <h2>canjea tu bono del 30% AHORA!</h2>
    <div class="extra">y comenzá a jugar</div>

    <a id="btnWhats" class="btn" target="_blank">
        <svg class="whatsapp-icon" viewBox="0 0 32 32" aria-hidden="true">
            <path fill="#25D366" d="M16.04 3C9.45 3 4.08 8.33 4.08 14.88c0 2.1.55 4.15 1.6 5.95L4 29l8.39-1.64a12.02 12.02 0 0 0 5.65 1.43h.01c6.59 0 11.96-5.33 11.96-11.89C30 8.33 22.63 3 16.04 3z"/>
            <path fill="#FFF" d="M22.95 19.42c-.38-.19-2.23-1.1-2.58-1.23-.35-.13-.6-.19-.86.19-.25.38-.99 1.23-1.21 1.48-.22.25-.45.29-.83.1-.38-.19-1.6-.59-3.05-1.88-1.13-1-1.89-2.24-2.11-2.62-.22-.38-.02-.58.17-.77.17-.17.38-.45.57-.67.19-.22.25-.38.38-.64.13-.25.06-.48-.03-.67-.1-.19-.86-2.07-1.18-2.84-.31-.74-.63-.64-.86-.65h-.73c-.25 0-.67.1-1.02.48-.35.38-1.34 1.31-1.34 3.19s1.37 3.7 1.56 3.95c.19.25 2.69 4.1 6.51 5.75.91.39 1.62.62 2.17.8.91.29 1.74.25 2.39.15.73-.11 2.23-.91 2.55-1.79.32-.88.32-1.63.22-1.79-.09-.16-.35-.25-.73-.44z"/>
        </svg>
        <span>CANJEAR BONO</span>
    </a>

    <div class="timer-text" id="timerText">
        Tiempo para canjear: 30 s
    </div>

    <div class="timer-bar">
        <div class="timer-fill" id="timerFill"></div>
    </div>

    <img src="ganamos.png" class="footer-logo" alt="Ganamos.net">

</div>

<script>
let tiempo = 30;
const barra = document.getElementById("timerFill");
const texto = document.getElementById("timerText");

const intervalo = setInterval(() => {
    tiempo--;

    if (tiempo <= 0) {
        tiempo = 0;
        clearInterval(intervalo);
        texto.innerHTML = "⛔ Bono expirado";
    } else {
        texto.innerHTML = "Tiempo para canjear: " + tiempo + " s";
    }

    barra.style.width = (tiempo / 30) * 100 + "%";
}, 1000);

function generarCodigo() {
    return Math.floor(1000 + Math.random() * 9000);
}

document.getElementById("btnWhats").addEventListener("click", function() {
    const codigo = generarCodigo();

    const mensaje = encodeURIComponent(
        "Hola vengo a reclamar mi bon0. Cod: " + codigo
    );

    this.href = "https://wa.me/543417418892?text=" + mensaje;
});
</script>

</body>
</html>
