<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxor Bonus</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    height: 100vh;
    background: black;
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
}

/* Fondo pirámide borroso */
.bg {
    position: absolute;
    width: 120%;
    height: 120%;
    background: url('https://images.unsplash.com/photo-1539650116574-75c0c6d0b6b8?q=80&w=1974&auto=format&fit=crop') center/cover no-repeat;
    filter: blur(12px) brightness(0.4);
    z-index: -1;
}

/* Contenedor */
.container {
    text-align: center;
    max-width: 400px;
}

/* Logo principal */
.logo {
    width: 280px;
    margin-bottom: 20px;
}

/* Texto */
h1 {
    font-size: 28px;
    color: #ffcc00;
}

h2 {
    font-size: 22px;
    margin: 10px 0 20px;
}

/* Barra tiempo */
.timer-bar {
    width: 100%;
    height: 10px;
    background: rgba(255,255,255,0.2);
    border-radius: 20px;
    overflow: hidden;
    margin-bottom: 30px;
}

.timer-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #a855f7, #9333ea);
    animation: countdown 20s linear forwards;
}

@keyframes countdown {
    from { width: 100%; }
    to { width: 0%; }
}

/* Botón glass */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 15px 25px;
    border-radius: 20px;
    background: rgba(168, 85, 247, 0.25);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(168, 85, 247, 0.6);
    color: white;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
    text-decoration: none;
}

.btn:hover {
    transform: scale(1.05);
    background: rgba(168, 85, 247, 0.5);
}

/* Logo abajo */
.footer-logo {
    margin-top: 40px;
    width: 220px;
    opacity: 0.9;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

    <!-- Logo principal -->
    <img src="logo.png" class="logo">

    <h1>¡Tiempo limitado!</h1>
    <h2>canjea tu bono del 30% AHORA!</h2>

    <!-- Barra tiempo -->
    <div class="timer-bar">
        <div class="timer-fill"></div>
    </div>

    <!-- Botón WhatsApp -->
    <a id="btnWhats" class="btn" target="_blank">
        📲 CANJEAR BONO
    </a>

    <!-- Logo inferior -->
    <img src="ganamos.png" class="footer-logo">

</div>

<script>
// Generador de código único de 4 dígitos
function generarCodigo() {
    return Math.floor(1000 + Math.random() * 9000);
}

document.getElementById("btnWhats").addEventListener("click", function() {
    let codigo = generarCodigo();

    let mensaje = encodeURIComponent(
        "Hola vengo a reclamar mi bon0. Cod: " + codigo
    );

    let url = "https://wa.me/543417418892?text=" + mensaje;

    this.href = url;
});
</script>

</body>
</html>
