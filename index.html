<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxor Bonus</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    color: white;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #050005;
    overflow: hidden;
}

/* FONDO: apenas opacado, pirámide visible */
.bg {
    position: fixed;
    inset: 0;
    background: url('fondooweb.png') center/cover no-repeat;
    z-index: -2;
}

.bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.28);
    z-index: -1;
}

/* CONTENEDOR */
.container {
    text-align: center;
    max-width: 410px;
    width: 92%;
    padding-top: 24px;
}

/* LOGO PRINCIPAL */
.logo {
    width: 190px;
    margin-bottom: 12px;
    filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.35));
}

/* TEXTOS */
h1 {
    font-size: 30px;
    color: #ffd700;
    text-shadow: 0 0 12px rgba(255, 215, 0, 0.75);
}

h2 {
    font-size: 22px;
    margin: 8px 0 6px;
    text-shadow: 0 0 10px rgba(0,0,0,0.9);
}

.bonus {
    font-size: 30px;
    color: #c084fc;
    font-weight: 900;
    text-shadow: 0 0 14px rgba(192,132,252,0.95);
}

.extra {
    font-size: 19px;
    color: #d8b4fe;
    font-weight: 700;
    margin-bottom: 24px;
    text-shadow: 0 0 10px rgba(168,85,247,0.9);
}

/* BOTÓN GLASS PRO */
.btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 18px 34px;
    border-radius: 26px;
    background: rgba(168, 85, 247, 0.34);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgba(232, 213, 255, 0.55);
    color: white;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 0.6px;
    text-decoration: none;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.35),
        inset 0 -10px 20px rgba(70,0,120,0.25),
        0 0 18px rgba(168,85,247,0.55),
        0 14px 34px rgba(0,0,0,0.35);
    animation: glassPulse 1.25s infinite ease-in-out;
    overflow: hidden;
}

.btn::before {
    content: "";
    position: absolute;
    inset: -8px;
    border-radius: 34px;
    border: 2px solid rgba(192,132,252,0.55);
    animation: pulseRing 1.25s infinite ease-out;
}

.btn::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,0.28), transparent);
    transform: translateX(-130%);
    animation: shine 2.3s infinite;
}

.btn span,
.whatsapp-icon {
    position: relative;
    z-index: 2;
}

.whatsapp-icon {
    width: 27px;
    height: 27px;
}

@keyframes glassPulse {
    0% {
        transform: scale(1);
        background: rgba(168, 85, 247, 0.28);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.35),
            inset 0 -10px 20px rgba(70,0,120,0.22),
            0 0 14px rgba(168,85,247,0.45),
            0 14px 34px rgba(0,0,0,0.35);
    }
    50% {
        transform: scale(1.08);
        background: rgba(126, 34, 206, 0.72);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.45),
            inset 0 -10px 24px rgba(80,0,140,0.35),
            0 0 34px rgba(192,132,252,0.95),
            0 0 58px rgba(147,51,234,0.7),
            0 18px 42px rgba(0,0,0,0.45);
    }
    100% {
        transform: scale(1);
        background: rgba(168, 85, 247, 0.28);
        box-shadow:
            inset 0 1px 0 rgba(255,255,255,0.35),
            inset 0 -10px 20px rgba(70,0,120,0.22),
            0 0 14px rgba(168,85,247,0.45),
            0 14px 34px rgba(0,0,0,0.35);
    }
}

@keyframes pulseRing {
    0% { transform: scale(0.94); opacity: 0.85; }
    100% { transform: scale(1.26); opacity: 0; }
}

@keyframes shine {
    0% { transform: translateX(-130%); }
    45% { transform: translateX(130%); }
    100% { transform: translateX(130%); }
}

/* SECCIÓN TIMER MÁS ABAJO */
.timer-section {
    margin-top: 34px;
}

.timer-text {
    font-size: 16px;
    color: #c9c9c9;
    font-weight: 800;
    margin-bottom: 9px;
    text-shadow: 0 0 8px rgba(0,0,0,0.9);
}

/* BARRA GLASS PRO */
.timer-bar {
    width: 100%;
    height: 16px;
    padding: 3px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.22);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.28),
        0 0 18px rgba(168,85,247,0.35),
        0 10px 25px rgba(0,0,0,0.35);
    overflow: hidden;
}

.timer-fill {
    height: 100%;
    width: 100%;
    border-radius: 999px;
    background: linear-gradient(90deg, #ede9fe, #c084fc, #9333ea, #581c87);
    box-shadow:
        0 0 14px rgba(192,132,252,0.9),
        inset 0 1px 0 rgba(255,255,255,0.5);
    transition: width 0.45s linear;
}

/* LOGO ABAJO MÁS BAJO */
.footer-logo {
    margin-top: 90px;
    width: 205px;
    max-width: 78%;
    opacity: 0.96;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.22));
}

@media (max-width: 480px) {
    .container {
        padding-top: 18px;
    }

    .logo {
        width: 175px;
    }

    h1 {
        font-size: 27px;
    }

    h2 {
        font-size: 20px;
    }

    .bonus {
        font-size: 28px;
    }

    .btn {
        font-size: 18px;
        padding: 17px 28px;
    }

    .timer-section {
        margin-top: 38px;
    }

    .footer-logo {
        margin-top: 95px;
        width: 195px;
    }
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

    <img src="logo.png" class="logo" alt="Luxor Red">

    <h1>¡Tiempo limitado!</h1>

    <h2>
        canjea tu bono del <span class="bonus">30%</span> AHORA!
    </h2>

    <div class="extra">y comenzá a jugar</div>

    <a id="btnWhats" class="btn" target="_blank">
        <svg class="whatsapp-icon" viewBox="0 0 32 32" aria-hidden="true">
            <path fill="#25D366" d="M16.04 3C9.45 3 4.08 8.33 4.08 14.88c0 2.1.55 4.15 1.6 5.95L4 29l8.39-1.64a12.02 12.02 0 0 0 5.65 1.43h.01c6.59 0 11.96-5.33 11.96-11.89C30 8.33 22.63 3 16.04 3z"/>
            <path fill="#FFF" d="M22.95 19.42c-.38-.19-2.23-1.1-2.58-1.23-.35-.13-.6-.19-.86.19-.25.38-.99 1.23-1.21 1.48-.22.25-.45.29-.83.1-.38-.19-1.6-.59-3.05-1.88-1.13-1-1.89-2.24-2.11-2.62-.22-.38-.02-.58.17-.77.17-.17.38-.45.57-.67.19-.22.25-.38.38-.64.13-.25.06-.48-.03-.67-.1-.19-.86-2.07-1.18-2.84-.31-.74-.63-.64-.86-.65h-.73c-.25 0-.67.1-1.02.48-.35.38-1.34 1.31-1.34 3.19s1.37 3.7 1.56 3.95c.19.25 2.69 4.1 6.51 5.75.91.39 1.62.62 2.17.8.91.29 1.74.25 2.39.15.73-.11 2.23-.91 2.55-1.79.32-.88.32-1.63.22-1.79-.09-.16-.35-.25-.73-.44z"/>
        </svg>
        <span>CANJEAR BONO</span>
    </a>

    <div class="timer-section">
        <div class="timer-text" id="timerText">Tiempo para canjear: 30 s</div>

        <div class="timer-bar">
            <div class="timer-fill" id="timerFill"></div>
        </div>
    </div>

    <img src="ganamos.png" class="footer-logo" alt="Ganamos.net">

</div>

<script>
let tiempo = 30;
const barra = document.getElementById("timerFill");
const texto = document.getElementById("timerText");

const intervalo = setInterval(() => {
    tiempo--;

    if (tiempo <= 0) {
        tiempo = 0;
        clearInterval(intervalo);
        texto.innerHTML = "⛔ Bono expirado";
    } else {
        texto.innerHTML = "Tiempo para canjear: " + tiempo + " s";
    }

    barra.style.width = (tiempo / 30) * 100 + "%";
}, 1000);

function generarCodigo() {
    return Math.floor(1000 + Math.random() * 9000);
}

document.getElementById("btnWhats").addEventListener("click", function() {
    const codigo = generarCodigo();

    const mensaje = encodeURIComponent(
        "Hola vengo a reclamar mi bon0. Cod: " + codigo
    );

    this.href = "https://wa.me/543417418892?text=" + mensaje;
});
</script>

</body>
</html>
