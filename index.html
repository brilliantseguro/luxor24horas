<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luxor Bonus</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
    color: white;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: #050005;
}

/* FONDO */
.bg {
    position: fixed;
    inset: 0;
    background: url('fondooweb.png') center/cover no-repeat;
    z-index: -2;
}

.bg::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        to bottom,
        rgba(0,0,0,0.4),
        rgba(0,0,0,0.65)
    );
}

/* CONTENEDOR */
.container {
    text-align: center;
    max-width: 410px;
    width: 92%;
    padding-top: 24px;
}

/* LOGO */
.logo {
    width: 190px;
    margin-bottom: 12px;
}

/* TEXTOS */
h1 {
    font-size: 30px;
    color: #ffd700;
}

h2 {
    font-size: 22px;
}

.bonus {
    font-size: 32px;
    color: #a020f0;
    font-weight: 900;
}

.extra {
    font-size: 20px;
    color: #a020f0;
    font-weight: 900;
    margin-bottom: 24px;
}

/* BOTÓN GLASS FUERTE */
.btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 20px 36px;
    border-radius: 26px;
    background: rgba(160, 32, 240, 0.5);
    backdrop-filter: blur(14px);
    border: 1px solid rgba(255,255,255,0.3);
    color: white;
    font-size: 20px;
    font-weight: 900;
    text-decoration: none;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); background: rgba(160,32,240,0.4);}
    50% { transform: scale(1.1); background: rgba(120,0,255,0.9);}
    100% { transform: scale(1);}
}

.whatsapp-icon {
    width: 26px;
}

/* TIMER */
.timer-section {
    margin-top: 34px;
}

.timer-text {
    font-size: 16px;
    color: #c9c9c9;
    margin-bottom: 8px;
}

.timer-bar {
    height: 14px;
    border-radius: 20px;
    background: rgba(255,255,255,0.2);
    overflow: hidden;
}

.timer-fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg, #a020f0, #6d28d9);
    transition: width 1s linear;
}

/* LOGO ABAJO */
.footer-logo {
    margin-top: 90px;
    width: 200px;
}

/* OVERLAY ESPERA */
.wait-screen {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 999;
}

.wait-screen img {
    width: 220px;
    margin-bottom: 20px;
}

.wait-text {
    color: #a020f0;
    font-size: 20px;
}
</style>
</head>

<body>

<div class="bg"></div>

<div class="container">

    <img src="logo.png" class="logo">

    <h1>¡Tiempo limitado!</h1>
    <h2>canjea tu bono del <span class="bonus">30%</span> AHORA!</h2>

    <div class="extra">y comenzá a jugar</div>

    <a id="btnWhats" class="btn">
        <svg class="whatsapp-icon" viewBox="0 0 32 32">
            <path fill="#25D366" d="M16.04 3C9.45 3 4.08 8.33 4.08 14.88c0 2.1.55 4.15 1.6 5.95L4 29l8.39-1.64a12.02 12.02 0 0 0 5.65 1.43h.01c6.59 0 11.96-5.33 11.96-11.89C30 8.33 22.63 3 16.04 3z"/>
            <path fill="#FFF" d="M22.95 19.42c-.38-.19-2.23-1.1-2.58-1.23-.35-.13-.6-.19-.86.19-.25.38-.99 1.23-1.21 1.48-.22.25-.45.29-.83.1-.38-.19-1.6-.59-3.05-1.88-1.13-1-1.89-2.24-2.11-2.62-.22-.38-.02-.58.17-.77.17-.17.38-.45.57-.67.19-.22.25-.38.38-.64.13-.25.06-.48-.03-.67-.10-.19-.86-2.07-1.18-2.84-.31-.74-.63-.64-.86-.65h-.73c-.25 0-.67.1-1.02.48-.35.38-1.34 1.31-1.34 3.19s1.37 3.7 1.56 3.95c.19.25 2.69 4.1 6.51 5.75.91.39 1.62.62 2.17.8.91.29 1.74.25 2.39.15.73-.11 2.23-.91 2.55-1.79.32-.88.32-1.63.22-1.79-.09-.16-.35-.25-.73-.44z"/>
        </svg>
        CANJEAR BONO
    </a>

    <div class="timer-section">
        <div class="timer-text" id="timerText">Tiempo para canjear: 30 s</div>
        <div class="timer-bar">
            <div class="timer-fill" id="timerFill"></div>
        </div>
    </div>

    <img src="ganamos.png" class="footer-logo">

</div>

<!-- PANTALLA DE ESPERA -->
<div class="wait-screen" id="waitScreen">
    <img src="LOGOESCRITO.png">
    <div class="wait-text">Redirigiendo...</div>
</div>

<script>
// contador
let tiempo = 30;
const barra = document.getElementById("timerFill");
const texto = document.getElementById("timerText");

setInterval(() => {
    tiempo--;
    if (tiempo <= 0) tiempo = 0;

    texto.innerHTML = "Tiempo para canjear: " + tiempo + " s";
    barra.style.width = (tiempo / 30) * 100 + "%";
}, 1000);

// botón con delay
function generarCodigo() {
    return Math.floor(1000 + Math.random() * 9000);
}

document.getElementById("btnWhats").addEventListener("click", function(e) {
    e.preventDefault();

    document.getElementById("waitScreen").style.display = "flex";

    let codigo = generarCodigo();

    let mensaje = encodeURIComponent(
        "Hola vengo a reclamar mi bon0. Cod: " + codigo
    );

    setTimeout(() => {
        window.location.href = "https://wa.me/543471318199?text=" + mensaje;
    }, 2000);
});
</script>

</body>
</html>
